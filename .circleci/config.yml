version: 2.1

executors:
  spiderweb-executor:
    docker:
      - image: cimg/python:3.10

jobs:
  build:
    executor: spiderweb-executor

    working_directory: ~/repo

    steps:
      - checkout

      - run:
          name: install dependencies
          command: |
            python3 -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install numpy==1.21.2
            pip install networkx==2.6.3
            pip install prettytable==0.7.2
            pip install biopython==1.81
            pip install psutil==5.9.5

      - run:
          name: temp style
          command: |
            . venv/bin/activate
            pip install pycodestyle
            pycodestyle --ignore=E501,E203,E731,W503,W292 */*py

      - run:
          name: run tests
          command: |
            . venv/bin/activate
            export PYTHONPATH=$PYTHONPATH:/home/circleci/repo 
            pip install pytest  
            pytest -v
          no_output_timeout: 200m

      - store_artifacts:
          path: test-reports
          destination: test-reports
